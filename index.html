<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aura Interiores</title>
<style>
body{margin:0;font-family:sans-serif;background:#faf7f3}
.header{display:flex;justify-content:space-between;align-items:center;padding:18px 30px;background:#fff;position:sticky;top:0}
.logo-area{display:flex;align-items:center;gap:12px}
.logo-area img{height:38px}
.hero{height:80vh;background:url('aura.jpg') center/cover;display:flex;align-items:center;justify-content:center;color:#fff;position:relative}
.hero::after{content:'';position:absolute;inset:0;background:rgba(0,0,0,.35)}
.hero-content{position:relative;z-index:1;text-align:center}
.btn{display:inline-block;margin-top:20px;padding:12px 28px;border:1px solid #fff;color:#fff;text-decoration:none}
</style>
</head>
<body>
<div class="header">
  <div class="logo-area">
    <img src="logo.png.jpeg" alt="logo AR">
    <img src="aura_text_logo.png" alt="Aura" style="height:26px" onerror="this.src='aura_text_logo.png.jpeg'">
  </div>
  <div>INÍCIO • PROJETOS • SOBRE</div>
</div>
<div class="hero">
  <div class="hero-content">
    <h1>Ambientes com alma</h1>
    <p>Design de interiores autoral</p>
    <a class="btn" href="#">Ver projetos</a>
  </div>
</div>
</body>
</html>
